[phases.setup]
nixPkgs = ["nodejs-20_x", "pnpm"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm --filter @saas-platform/shared build",
  "cd apps/backend && pnpm prisma generate",
  "pnpm --filter @saas-platform/backend build"
]

[start]
cmd = "cd apps/backend && pnpm start:prod"
